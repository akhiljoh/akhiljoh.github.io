<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background — matches --ink: #070707 -->
  <rect width="64" height="64" rx="11" fill="#070707"/>
  <!-- Inset border — matches --gold: #c8a96e at low opacity -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="9" fill="none" stroke="#c8a96e" stroke-width="0.75" opacity="0.28"/>
  <!-- Monogram — Georgia is the closest system serif to Cormorant Garamond -->
  <text
    x="32" y="35"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="24"
    fill="#c8a96e"
    letter-spacing="1"
  >MT</text>
</svg>
